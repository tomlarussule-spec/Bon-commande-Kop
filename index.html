<meta charset="UTF-8" />

<title>Bon de commande – Koppert</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #f5f5f3; color: #1a1a1a; font-size: 15px; line-height: 1.5; }
  .container { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  .page-header { margin-bottom: 2rem; }
  .page-header h1 { font-size: 22px; font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 10px; }
  .page-header h1 svg { width: 22px; height: 22px; flex-shrink: 0; }
  .page-header p { font-size: 14px; color: #666; margin-top: 5px; }

  /* Champ nom surligné */
  .name-row { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
  .name-row label { font-size: 15px; font-weight: 600; color: #1a1a1a; white-space: nowrap; }
  .name-row input { flex: 1; padding: 10px 14px; font-size: 15px; font-weight: 500; border-radius: 8px; border: 2px solid #1D9E75; background: #E1F5EE; color: #085041; outline: none; transition: border-color .15s, background .15s; }
  .name-row input:focus { border-color: #0F6E56; background: #c8ede1; }
  .name-row input::placeholder { color: #5DCAA5; font-weight: 400; font-style: italic; }

  /* Search */
  .search-wrap { margin-bottom: 1.25rem; position: relative; }
  .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #999; pointer-events: none; }
  .search-wrap input { width: 100%; padding: 9px 12px 9px 36px; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a1a; outline: none; transition: border-color .15s; }
  .search-wrap input:focus { border-color: #0f6e56; }

  /* Section blocks */
  .section-block { background: #fff; border: 1px solid #e5e5e3; border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 11px 15px; cursor: pointer; user-select: none; background: #fafaf8; transition: background .1s; }
  .section-header:hover { background: #f0f0ee; }
  .section-header h2 { font-size: 12.5px; font-weight: 600; color: #444; text-transform: uppercase; letter-spacing: .06em; display: flex; align-items: center; gap: 7px; }
  .section-header h2 svg { width: 14px; height: 14px; color: #0f6e56; flex-shrink: 0; }
  .section-meta { display: flex; align-items: center; gap: 8px; }
  .section-meta .count { font-size: 12px; color: #999; }
  .chevron { width: 16px; height: 16px; color: #aaa; transition: transform .2s; flex-shrink: 0; }
  .section-header.open .chevron { transform: rotate(180deg); }
  .product-list { display: none; }
  .product-list.open { display: block; }

  /* Product rows */
  .product-row { display: flex; align-items: center; gap: 10px; padding: 8px 15px; border-top: 1px solid #f0f0ee; transition: background .1s; }
  .product-row:hover { background: #fafaf8; }
  .qty-control { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
  .qty-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid #ddd; background: #fff; color: #444; font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; transition: background .1s, border-color .1s; }
  .qty-btn:hover { background: #f0f0ee; border-color: #bbb; }
  .qty-input { width: 44px; text-align: center; font-size: 14px; border: 1px solid #ddd; border-radius: 7px; padding: 4px 2px; background: #fff; color: #1a1a1a; outline: none; transition: border-color .15s; }
  .qty-input:focus { border-color: #0f6e56; }
  .qty-input.active { border-color: #1d9e75; background: #e1f5ee; color: #085041; font-weight: 600; }
  .product-code { font-size: 11.5px; color: #aaa; width: 58px; flex-shrink: 0; font-family: 'SF Mono', 'Fira Code', monospace; }
  .product-name { font-size: 13.5px; color: #1a1a1a; flex: 1; }
  .bio-badge { font-size: 10.5px; background: #eaf3de; color: #3b6d11; padding: 2px 6px; border-radius: 4px; font-weight: 500; flex-shrink: 0; }

  /* Summary */
  .summary-section { background: #fff; border: 1px solid #e5e5e3; border-radius: 10px; margin-top: 2rem; overflow: hidden; }
  .summary-header { padding: 13px 16px; background: #fafaf8; border-bottom: 1px solid #e5e5e3; display: flex; align-items: center; justify-content: space-between; }
  .summary-header h2 { font-size: 15px; font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
  .summary-header h2 svg { width: 17px; height: 17px; color: #0f6e56; }
  .summary-stats { font-size: 13px; color: #888; background: #f0f0ee; padding: 3px 10px; border-radius: 20px; }
  .summary-body { padding: 14px 16px; }
  .summary-empty { font-size: 14px; color: #aaa; text-align: center; padding: 24px 0; }
  .confirmation-phrase { padding: 10px 14px; background: #fafaf8; border-radius: 8px; border: 1px solid #e5e5e3; font-size: 13.5px; color: #666; font-style: italic; display: flex; align-items: center; gap: 8px; }
  .confirmation-phrase svg { width: 15px; height: 15px; color: #0f6e56; flex-shrink: 0; }
  .summary-list { margin-top: 10px; }
  .summary-item { display: flex; align-items: center; font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid #f0f0ee; gap: 10px; }
  .summary-item:last-child { border-bottom: none; }
  .summary-qty { font-weight: 600; color: #0f6e56; white-space: nowrap; min-width: 40px; flex-shrink: 0; }
  .summary-code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11.5px; color: #bbb; flex-shrink: 0; }
  .summary-name { color: #1a1a1a; flex: 1; }

  /* Email copy */
  .copy-area { margin-top: 14px; border-top: 1px solid #f0f0ee; padding-top: 14px; }
  .copy-area label { font-size: 12px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 6px; }
  .copy-area textarea { width: 100%; font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; background: #fafaf8; color: #1a1a1a; resize: vertical; min-height: 120px; outline: none; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-copy { flex: 1; padding: 9px; font-size: 14px; font-weight: 500; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #1a1a1a; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background .1s, border-color .1s, color .1s; }
  .btn-copy:hover { background: #f0f0ee; }
  .btn-copy.copied { border-color: #0f6e56; color: #0f6e56; background: #e1f5ee; }
  .btn-reset { padding: 9px 14px; font-size: 13px; border: 1px solid #ddd; border-radius: 8px; background: #fff; color: #888; cursor: pointer; transition: background .1s; }
  .btn-reset:hover { background: #f0f0ee; color: #444; }
  .no-results { text-align: center; color: #aaa; font-size: 14px; padding: 2rem 0; }

    {code:"CA5002",name:"MICROFLORA PRO – Mini 8oz",bio:true},{code:"CA5000",name:"MICROFLORA PRO – 4 litres",bio:true},
    {code:"CA5003",name:"MICROFLORA PRO – 10 litres",bio:true}
  ]},
  { id:"divers", title:"Divers et applicateurs", products:[
    {code:"CA7403",name:"DIBOX 25"},{code:"07401",name:"DIBOX 400"},{code:"PR28256",name:"LOUPE D'OBSERVATION"},
    {code:"07700",name:"AIRBUG applicateur"},{code:"07760",name:"MINI-AIRBUG applicateur"},
    {code:"07702",name:"Batterie MINI-AIRBUG 6V"},{code:"07805",name:"Applicateur TRIANUM-G"},
    {code:"07827",name:"NATUTEC AIROBREEZ"},{code:"07706",name:"NATUTEC AIROBREEZ BATTERY"},
    {code:"07707",name:"NATUTEC AIROBREEZ 3PC CLIPS"},{code:"07710",name:"NATUTEC AIROBREEZ TRANSPARENT RESERVOIR"}
  ]},
  { id:"depistage", title:"Dépistage", products:[
    {code:"CA8500",name:"SCOUTING SERVICES – Horaire"},{code:"CA8505",name:"SCOUTING SERVICES – Par acre"},
    {code:"CA8510",name:"SCOUTING SERVICES – Cartes collantes seulement"}
  ]},
  { id:"tests", title:"Tests diagnostic", products:[
    {code:"CA9016",name:"ANALYSE DE MALADIES OU DE RÉSIDUS DE PESTICIDES"},
    {code:"CA9017",name:"ANALYSE DE MALADIES OU DE VIRUS"}
  ]}
];

const CONFIRMATION = "Pouvez-vous m'envoyer la confirmation de cette commande ?";
const quantities = {};

function uid(secId, code, name) { return secId + '||' + code + '||' + name; }
function esc(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

function renderSections(filter) {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  const q = (filter || '').toLowerCase().trim();
  let totalVisible = 0;
  const leafIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>`;
  const chevronIcon = `<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;

  SECTIONS.forEach(sec => {
    const prods = q ? sec.products.filter(p => p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q)) : sec.products;
    if (!prods.length) return;
    totalVisible++;
    const isOpen = !!q;
    const block = document.createElement('div');
    block.className = 'section-block';
    block.innerHTML = `
      <div class="section-header${isOpen?' open':''}" onclick="toggleSection(this)">
        <h2>${leafIcon}${sec.title}</h2>
        <div class="section-meta">
          <span class="count">${prods.length} produit${prods.length>1?'s':''}</span>
          ${chevronIcon}
        </div>
      </div>
      <div class="product-list${isOpen?' open':''}">
        ${prods.map(p => {
          const key = uid(sec.id, p.code, p.name);
          const qty = quantities[key] || 0;
          return `<div class="product-row">
            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty('${esc(key)}',-1)" aria-label="Diminuer">−</button>
              <input class="qty-input${qty>0?' active':''}" type="number" min="0" value="${qty}" id="inp-${esc(key)}"
                onchange="setQtyFromInput('${esc(key)}',this.value)" />
              <button class="qty-btn" onclick="changeQty('${esc(key)}',1)" aria-label="Augmenter">+</button>
            </div>
            <span class="product-code">${p.code}</span>
            <span class="product-name">${p.name}${p.bio ? ' <span class="bio-badge">BIO</span>' : ''}</span>
          </div>`;
        }).join('')}
      </div>`;
    container.appendChild(block);
  });
  document.getElementById('no-results').style.display = totalVisible === 0 ? 'block' : 'none';
}

function toggleSection(header) {
  header.classList.toggle('open');
  header.nextElementSibling.classList.toggle('open');
}

function changeQty(key, delta) {
  quantities[key] = Math.max(0, (quantities[key] || 0) + delta);
  const inp = document.getElementById('inp-' + key);
  if (inp) { inp.value = quantities[key]; inp.className = 'qty-input' + (quantities[key]>0?' active':''); }
  updateSummary();
}

function setQtyFromInput(key, val) {
  quantities[key] = Math.max(0, parseInt(val) || 0);
  const inp = document.getElementById('inp-' + key);
  if (inp) { inp.value = quantities[key]; inp.className = 'qty-input' + (quantities[key]>0?' active':''); }
  updateSummary();
}

function updateSummary() {
  const items = [];
  SECTIONS.forEach(sec => sec.products.forEach(p => {
    const key = uid(sec.id, p.code, p.name);
    const qty = quantities[key] || 0;
    if (qty > 0) items.push({ code: p.code, name: p.name, qty });
  }));

  const clientName = (document.getElementById('client-name').value || '').trim();
  document.getElementById('summary-stats').textContent = items.length + ' produit' + (items.length !== 1 ? 's' : '') + ' sélectionné' + (items.length !== 1 ? 's' : '');

  const content = document.getElementById('summary-content');
  const copyArea = document.getElementById('copy-area');

  if (!items.length) {
    content.innerHTML = '<p class="summary-empty">Aucun produit sélectionné pour l\'instant.</p>';
    copyArea.style.display = 'none';
    return;
  }

  content.innerHTML = items.map(item =>
    `<div class="summary-item">
      <span class="summary-qty">${item.qty} x</span>
      <span class="summary-code">${item.code}</span>
      <span class="summary-name">${item.name}</span>
    </div>`
  ).join('');

  const today = new Date().toLocaleDateString('fr-CA');
  const header = 'Commande pour : ' + clientName + ' — ' + today;
  const lines = [header, ''];
  items.forEach(item => lines.push(item.qty + ' x  ' + item.code + '  ' + item.name));
  lines.push('');
  lines.push(CONFIRMATION);

  copyArea.style.display = 'block';
  document.getElementById('email-text').value = lines.join('\n');
  const btn = document.getElementById('btn-copy');
  btn.className = 'btn-copy';
  btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copier pour le courriel';
}

function copyEmail() {
  const txt = document.getElementById('email-text');
  txt.select();
  document.execCommand('copy');
  const btn = document.getElementById('btn-copy');
  btn.className = 'btn-copy copied';
  btn.innerHTML = '✓ Copié !';
  setTimeout(() => {
    btn.className = 'btn-copy';
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copier pour le courriel';
  }, 2000);
}

function resetAll() {
  Object.keys(quantities).forEach(k => delete quantities[k]);
  document.getElementById('client-name').value = '';
  renderSections(document.getElementById('search').value);
  updateSummary();
}

function filterProducts(val) { renderSections(val); }

renderSections('');
</script>
</body>
